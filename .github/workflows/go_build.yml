name: CI
on:
  pull_request:
  push:
    branches:
      - dev
jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.26.4

      - name: Build
        run: go build -v ./cmd/mithril

      - name: Rewards and replay regressions
        run: GOMAXPROCS=2 go test -race -p 2 -count=1 ./pkg/rewards ./pkg/replay
