name: CI
on:
  pull_request:
  push:
    branches:
      - dev
jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.27.3

      - name: Build
        run: go build -v ./cmd/mithril

  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.27.3

      - name: Voting, checkpoint, streaming and scheduler race regressions
        # Run the complete affected package suites, including subprocess crash
        # recovery and cancellation tests.
        run: >-
          go test -race -p 2 -count=1
          ./pkg/alpenglow ./pkg/consensus ./pkg/replay ./pkg/rewards
          ./pkg/rpcserver ./pkg/epochrewards
          ./pkg/turbine ./pkg/shredcap ./pkg/sigverify ./pkg/blockprod/...
          ./cmd/mithril/node ./cmd/mithril/configcmd

      - name: Interpreter differential and memory race regressions
        run: go test -race -count=1 ./pkg/sbpf/...

      - name: Interpreter and runtime with the assembly loop on
        # The amd64 assembly loop is off by default. This runs its full
        # comparison against the Go loop (sized down under the race detector
        # above) and the runtime suite with the loop in place.
        env:
          MITHRIL_SBPF_ASM_LOOP: "1"
        run: go test -count=1 ./pkg/sbpf/... ./pkg/sealevel

      - name: Sealevel interpreter, syscall and vote ownership regressions
        run: go test -race -count=1 ./pkg/sealevel

      - name: Account hashing, accelerated and portable
        # The AVX-512 output tests skip on runners without AVX-512F; the
        # layout guard, the startup output check and the purego build run
        # everywhere.
        run: |
          go test -race -count=1 ./pkg/lthash
          go test -count=1 -tags purego ./pkg/lthash
