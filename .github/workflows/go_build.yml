name: CI
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25.5

      - name: Build
        run: go build -v ./cmd/mithril
