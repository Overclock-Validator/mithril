name: CI
on:
  pull_request:
  push:
    branches:
      - dev
jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.27.3

      - name: Build
        run: go build -v ./cmd/mithril

      - name: Build dashboard reader
        run: go build -v ./cmd/mithril-dashboard

      - name: Build dashboard collector
        run: go build -v ./cmd/mithril-dashboard-collect

  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.27.3

      - name: Dashboard data-owner race regressions
        run: |
          set -euo pipefail
          full_log="$(mktemp "$RUNNER_TEMP/dashboard-owners-full.XXXXXX")"
          focused_log="$(mktemp "$RUNNER_TEMP/dashboard-owners-focused.XXXXXX")"
          trap 'rm -f "$full_log" "$focused_log"' EXIT
          timeout 360s go test -race -p 1 -count=1 -timeout=120s -v \
            ./pkg/metrics ./pkg/snapshot \
            ./pkg/accountsdb ./pkg/gossip ./pkg/harmonic | tee "$full_log"
          timeout 360s go test -race -p 1 -count=1 -timeout=120s -v \
            -run '^TestQueuePressureNativeBounds$' \
            ./pkg/tpu/... | tee "$focused_log"
          for name in \
            TestHostSamplerLinuxCapture TestProcessRSSBreakdownLiveLinux \
            TestDashboardManifestFailureDoesNotPublish TestDashboardManifestBuilderPublishesOnlySuccessfulParses \
            TestAutoBuilderStopsBeforeIngestOnShardFailure \
            TestCommonTiersTransitionsAndOwnership TestCommonTiersCollisionAndConcurrentAccess \
            TestCompactionLiveRecords TestCompactComparatorLegacyEquivalence \
            TestMonitoringConcurrentReadersAndPublisher TestMonitoringPeersRequireVerifiedMatchingContact \
            TestPullRequestPacketLoopCountsActualWrites; do
            grep -q "^--- PASS: $name " "$full_log"
          done
          for name in \
            TestQueuePressureNativeBounds; do
            grep -q "^--- PASS: $name " "$focused_log"
          done

      - name: Voting, checkpoint, streaming and scheduler race regressions
        # Run these complete package suites, including subprocess crash
        # recovery and cancellation tests.
        run: >-
          go test -race -p 2 -count=1
          ./pkg/alpenglow ./pkg/consensus ./pkg/replay ./pkg/rewards
          ./pkg/rpcserver ./pkg/epochrewards
          ./pkg/dashboard/... ./pkg/blockstream
          ./pkg/block ./pkg/epochstakes ./pkg/global ./pkg/leaderschedule
          ./pkg/progress ./pkg/rewardcerts ./pkg/state
          ./pkg/turbine ./pkg/sigverify ./pkg/blockprod/...
          ./cmd/mithril/node ./cmd/mithril/configcmd ./cmd/mithril-dashboard-collect

      - name: Interpreter differential and memory race regressions
        run: go test -race -count=1 ./pkg/sbpf/...

      - name: Sealevel interpreter, syscall and vote ownership regressions
        run: go test -race -count=1 ./pkg/sealevel

      - name: Account hashing, accelerated and portable
        # The AVX-512 output tests skip on runners without AVX-512F; the
        # layout guard, the startup output check and the purego build run
        # everywhere.
        run: |
          go test -race -count=1 ./pkg/lthash
          go test -count=1 -tags purego ./pkg/lthash
