name: CI
on:
  pull_request:
  push:
    branches:
      - dev
jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25.5

      - name: Build
        run: go build -v ./cmd/mithril

  nix-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Nix flake check
        run: nix flake check
