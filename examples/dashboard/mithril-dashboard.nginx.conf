# Include inside nginx's http context. Replace dashboard.example.com with the
# reader's HTTPS hostname and use the provisioned certificate and key paths.
# Set root to the built viewer dist. Keep TLS and htpasswd outside that root.
# Give the nginx worker read access to the htpasswd file, never write access.

# Match the raw request target so rewrites, escapes and extra query parameters
# cannot expand the reader routes. Disabled reader features still return 404.
map $request_uri $mithril_dashboard_reader_request {
    default 0;

    "~^/api/v1/(?:features|status)(?:[?]include=advanced_status)?$" 1;
    "~^/api/v1/(?:cluster-map|node-display)$" 1;
    "~^/api/v1/cluster-(?:versions|performance-history)[?]generation=[0-9a-f]{64}$" 1;
    "~^/api/v1/cluster[?]search=[1-9A-HJ-NP-Za-km-z]{32,44}&generation=[0-9a-f]{64}$" 1;

    "~^/api/v1/details/(?:activity-history|cache|network|peers|recent-executed|schedule|selected|selected-window|storage)$" 1;
    "~^/api/v1/details/selected[?]generation=[0-9a-f]{64}&page=(?:[0-9]|[12][0-9]|3[01])$" 1;
    "~^/api/v1/details/schedule/data/[0-9a-f]{64}$" 1;

    # Optional reception data requires the node and reader opt-ins.
    "~^/api/v1/details/reception$" 1;
    "~^/api/v1/details/reception/(?:cursor|index)/[0-9a-f]{64}[?]after=(?:0|[1-9][0-9]{0,19})$" 1;
    "~^/api/v1/details/reception/chunk/[0-9a-f]{64}/[0-9a-f]{64}$" 1;

    "~^/websocket[?]include=advanced_status(?:&recent_executed=v[12])?$" 1;
}

map "$uri:$http_upgrade" $mithril_dashboard_upgrade {
    default "";
    "~*^/websocket:websocket$" websocket;
}

map $mithril_dashboard_upgrade $mithril_dashboard_connection {
    default close;
    websocket upgrade;
}

# Always fetch the current entrypoint after a release switch. Fingerprinted
# assets and the reader's cache and freshness headers keep their own policy.
map $uri $mithril_dashboard_entrypoint_cache {
    default "";
    / "no-store";
    /index.html "no-store";
}

server {
    listen 443 ssl;
    server_name dashboard.example.com;

    ssl_certificate /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    satisfy all;
    auth_basic "Mithril Dashboard";
    auth_basic_user_file /etc/nginx/mithril-dashboard.htpasswd;

    root /srv/mithril-dashboard/dist;
    include /etc/nginx/mime.types;
    disable_symlinks on from=$document_root;
    expires off;
    add_header Cache-Control $mithril_dashboard_entrypoint_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    if ($http_host != dashboard.example.com) { return 421; }

    # The viewer's route is a URL fragment. Only the entrypoint and built
    # asset directories need file access.
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location ~ "^/(assets|brand|fonts|licenses)/[A-Za-z0-9_-][A-Za-z0-9._-]*$" {
        try_files $uri =404;
    }

    location ~ "^/(api/|websocket$)" {
        if ($request_method != GET) { return 405; }
        if ($mithril_dashboard_reader_request = 0) { return 404; }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_pass_request_headers on;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $mithril_dashboard_upgrade;
        proxy_set_header Connection $mithril_dashboard_connection;
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Cookie "";

        # Other request headers are passed unchanged, including Mithril's
        # network negotiation headers. Keep the reader's freshness response
        # headers and Cache-Control, and avoid buffering leased responses.
        proxy_pass_header Cache-Control;
        proxy_pass_header ETag;
        proxy_pass_header Mithril-Status-Remaining-Milliseconds;
        proxy_pass_header Mithril-Detail-Remaining-Milliseconds;
        proxy_pass_header Mithril-Cluster-Remaining-Milliseconds;
        proxy_intercept_errors off;
        proxy_cache off;
        proxy_buffering off;
        proxy_ignore_headers X-Accel-Redirect X-Accel-Buffering;
    }

    location / {
        return 404;
    }
}
